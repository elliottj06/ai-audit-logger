<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Audit Logger</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { background: #0f1117; color: #e2e8f0; }
    .card { background: #1a1d2e; border: 1px solid #2d3148; }
    .badge-openai { background: #10a37f22; color: #10a37f; }
    .badge-anthropic { background: #d97b4522; color: #e8945a; }
    .badge-other { background: #6366f122; color: #818cf8; }
    .badge-error { background: #ef444422; color: #f87171; }
    .badge-ok { background: #22c55e22; color: #4ade80; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1a1d2e; }
    ::-webkit-scrollbar-thumb { background: #2d3148; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen font-mono text-sm">

  <!-- Header -->
  <div class="border-b border-slate-800 px-6 py-4 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
      <span class="text-white font-semibold text-base">AI Audit Logger</span>
    </div>
    <div class="flex items-center gap-4 text-slate-400 text-xs">
      <span id="last-updated">—</span>
      <button onclick="refresh()" class="px-3 py-1 rounded border border-slate-700 hover:border-slate-500 hover:text-white transition-colors">
        Refresh
      </button>
    </div>
  </div>

  <div class="p-6 space-y-6 max-w-7xl mx-auto">

    <!-- Stat Cards -->
    <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="card rounded-lg p-4">
        <div class="text-slate-400 text-xs mb-1">Total Calls</div>
        <div id="stat-calls" class="text-2xl font-bold text-white">—</div>
      </div>
      <div class="card rounded-lg p-4">
        <div class="text-slate-400 text-xs mb-1">Total Cost</div>
        <div id="stat-cost" class="text-2xl font-bold text-green-400">—</div>
      </div>
      <div class="card rounded-lg p-4">
        <div class="text-slate-400 text-xs mb-1">Avg Latency</div>
        <div id="stat-latency" class="text-2xl font-bold text-blue-400">—</div>
      </div>
      <div class="card rounded-lg p-4">
        <div class="text-slate-400 text-xs mb-1">Tokens Used</div>
        <div id="stat-tokens" class="text-2xl font-bold text-purple-400">—</div>
      </div>
    </div>

    <!-- Charts Row -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
      <div class="card rounded-lg p-4">
        <div class="text-slate-300 text-xs font-semibold mb-4 uppercase tracking-wider">Calls by Model</div>
        <canvas id="chart-models" height="180"></canvas>
      </div>
      <div class="card rounded-lg p-4">
        <div class="text-slate-300 text-xs font-semibold mb-4 uppercase tracking-wider">Cost by Model (USD)</div>
        <canvas id="chart-cost" height="180"></canvas>
      </div>
    </div>

    <!-- Filters -->
    <div class="card rounded-lg p-4">
      <div class="flex flex-wrap gap-3 items-center">
        <span class="text-slate-400 text-xs uppercase tracking-wider">Filter:</span>
        <select id="filter-provider" onchange="applyFilters()" class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-300 focus:outline-none focus:border-slate-500">
          <option value="">All Providers</option>
          <option value="openai">OpenAI</option>
          <option value="anthropic">Anthropic</option>
        </select>
        <input id="filter-model" oninput="applyFilters()" placeholder="Model..." class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-300 focus:outline-none focus:border-slate-500 w-40" />
        <input id="filter-user" oninput="applyFilters()" placeholder="User ID..." class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-300 focus:outline-none focus:border-slate-500 w-40" />
        <input id="filter-app" oninput="applyFilters()" placeholder="App name..." class="bg-slate-800 border border-slate-700 rounded px-2 py-1 text-xs text-slate-300 focus:outline-none focus:border-slate-500 w-40" />
        <button onclick="clearFilters()" class="text-xs text-slate-500 hover:text-slate-300 transition-colors">Clear</button>
        <span id="filter-count" class="ml-auto text-xs text-slate-500"></span>
      </div>
    </div>

    <!-- Log Table -->
    <div class="card rounded-lg overflow-hidden">
      <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
        <span class="text-slate-300 text-xs font-semibold uppercase tracking-wider">Recent Calls</span>
        <span class="text-slate-500 text-xs">click a row for full detail</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-xs">
          <thead>
            <tr class="text-slate-500 border-b border-slate-800">
              <th class="text-left px-4 py-2 font-normal">Timestamp</th>
              <th class="text-left px-4 py-2 font-normal">Provider</th>
              <th class="text-left px-4 py-2 font-normal">Model</th>
              <th class="text-left px-4 py-2 font-normal">User</th>
              <th class="text-right px-4 py-2 font-normal">Tokens</th>
              <th class="text-right px-4 py-2 font-normal">Cost</th>
              <th class="text-right px-4 py-2 font-normal">Latency</th>
              <th class="text-center px-4 py-2 font-normal">Status</th>
            </tr>
          </thead>
          <tbody id="log-table-body">
            <tr><td colspan="8" class="px-4 py-8 text-center text-slate-600">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50 p-4" onclick="closeModal(event)">
    <div class="card rounded-lg p-6 max-w-2xl w-full max-h-[80vh] overflow-y-auto" onclick="event.stopPropagation()">
      <div class="flex justify-between items-center mb-4">
        <span class="text-white font-semibold">Call Detail</span>
        <button onclick="document.getElementById('modal').classList.add('hidden')" class="text-slate-500 hover:text-white text-lg">✕</button>
      </div>
      <div id="modal-content" class="space-y-3"></div>
    </div>
  </div>

  <script>
    let allEntries = [];
    let modelChart, costChart;

    async function fetchStats() {
      const r = await fetch('/api/v1/logs/stats');
      const data = await r.json();

      document.getElementById('stat-calls').textContent = data.total_calls.toLocaleString();
      document.getElementById('stat-cost').textContent = '$' + data.total_cost_usd.toFixed(4);
      document.getElementById('stat-latency').textContent = Math.round(data.avg_latency_ms) + 'ms';
      document.getElementById('stat-tokens').textContent = (data.total_tokens_in + data.total_tokens_out).toLocaleString();

      renderCharts(data.by_model);
    }

    async function fetchLogs() {
      const r = await fetch('/api/v1/logs?limit=200');
      const data = await r.json();
      allEntries = data.entries;
      applyFilters();
      document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
    }

    function applyFilters() {
      const provider = document.getElementById('filter-provider').value;
      const model = document.getElementById('filter-model').value.toLowerCase();
      const user = document.getElementById('filter-user').value.toLowerCase();
      const app = document.getElementById('filter-app').value.toLowerCase();

      const filtered = allEntries.filter(e =>
        (!provider || e.provider === provider) &&
        (!model || (e.model || '').toLowerCase().includes(model)) &&
        (!user || (e.user_id || '').toLowerCase().includes(user)) &&
        (!app || (e.app_name || '').toLowerCase().includes(app))
      );

      document.getElementById('filter-count').textContent = filtered.length + ' entries';
      renderTable(filtered);
    }

    function clearFilters() {
      document.getElementById('filter-provider').value = '';
      document.getElementById('filter-model').value = '';
      document.getElementById('filter-user').value = '';
      document.getElementById('filter-app').value = '';
      applyFilters();
    }

    function renderTable(entries) {
      const tbody = document.getElementById('log-table-body');
      if (!entries.length) {
        tbody.innerHTML = '<tr><td colspan="8" class="px-4 py-8 text-center text-slate-600">No entries found</td></tr>';
        return;
      }

      tbody.innerHTML = entries.map(e => {
        const ts = e.timestamp.slice(0, 19).replace('T', ' ');
        const cost = e.cost_usd != null ? '$' + e.cost_usd.toFixed(5) : '—';
        const latency = e.latency_ms != null ? Math.round(e.latency_ms) + 'ms' : '—';
        const tokens = (e.tokens_in || 0) + ' → ' + (e.tokens_out || 0);
        const providerClass = e.provider === 'openai' ? 'badge-openai' : e.provider === 'anthropic' ? 'badge-anthropic' : 'badge-other';
        const statusClass = e.error ? 'badge-error' : 'badge-ok';
        const statusText = e.error ? 'ERROR' : 'OK';

        return `<tr class="border-b border-slate-800/50 hover:bg-slate-800/30 cursor-pointer transition-colors" onclick='showDetail(${JSON.stringify(e).replace(/'/g, "&#39;")})'>
          <td class="px-4 py-2 text-slate-400">${ts}</td>
          <td class="px-4 py-2"><span class="px-2 py-0.5 rounded text-xs ${providerClass}">${e.provider}</span></td>
          <td class="px-4 py-2 text-slate-300">${e.model}</td>
          <td class="px-4 py-2 text-slate-500">${e.user_id || '—'}</td>
          <td class="px-4 py-2 text-right text-slate-400">${tokens}</td>
          <td class="px-4 py-2 text-right text-green-400">${cost}</td>
          <td class="px-4 py-2 text-right text-blue-400">${latency}</td>
          <td class="px-4 py-2 text-center"><span class="px-2 py-0.5 rounded text-xs ${statusClass}">${statusText}</span></td>
        </tr>`;
      }).join('');
    }

    function renderCharts(byModel) {
      const labels = byModel.map(m => m.model.length > 20 ? m.model.slice(0, 20) + '…' : m.model);
      const calls = byModel.map(m => m.calls);
      const costs = byModel.map(m => m.cost_usd);
      const colors = ['#10a37f', '#e8945a', '#818cf8', '#facc15', '#f87171', '#38bdf8'];

      if (modelChart) modelChart.destroy();
      if (costChart) costChart.destroy();

      const opts = {
        responsive: true,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: '#1e293b' } },
          y: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { color: '#1e293b' } }
        }
      };

      modelChart = new Chart(document.getElementById('chart-models'), {
        type: 'bar',
        data: { labels, datasets: [{ data: calls, backgroundColor: colors, borderRadius: 4 }] },
        options: { ...opts, plugins: { ...opts.plugins } }
      });

      costChart = new Chart(document.getElementById('chart-cost'), {
        type: 'bar',
        data: { labels, datasets: [{ data: costs, backgroundColor: colors.map(c => c + '99'), borderRadius: 4 }] },
        options: { ...opts, plugins: { ...opts.plugins } }
      });
    }

    function showDetail(entry) {
      const modal = document.getElementById('modal');
      const content = document.getElementById('modal-content');

      const rows = [
        ['ID', entry.id],
        ['Timestamp', entry.timestamp],
        ['Provider', entry.provider],
        ['Model', entry.model],
        ['App', entry.app_name || '—'],
        ['User', entry.user_id || '—'],
        ['Session', entry.session_id || '—'],
        ['Tokens In', entry.tokens_in ?? '—'],
        ['Tokens Out', entry.tokens_out ?? '—'],
        ['Cost', entry.cost_usd != null ? '$' + entry.cost_usd.toFixed(6) : '—'],
        ['Latency', entry.latency_ms != null ? Math.round(entry.latency_ms) + 'ms' : '—'],
        ['Error', entry.error || null],
      ].filter(([, v]) => v !== null);

      content.innerHTML = rows.map(([k, v]) => `
        <div class="flex gap-4">
          <span class="text-slate-500 w-24 shrink-0">${k}</span>
          <span class="text-slate-300 break-all">${v}</span>
        </div>`).join('');

      if (entry.prompt) {
        content.innerHTML += `<div class="mt-3"><div class="text-slate-500 mb-1">Prompt</div><pre class="bg-slate-900 rounded p-3 text-xs text-slate-300 overflow-x-auto whitespace-pre-wrap">${escapeHtml(entry.prompt)}</pre></div>`;
      }
      if (entry.response) {
        content.innerHTML += `<div class="mt-3"><div class="text-slate-500 mb-1">Response</div><pre class="bg-slate-900 rounded p-3 text-xs text-slate-300 overflow-x-auto whitespace-pre-wrap">${escapeHtml(entry.response)}</pre></div>`;
      }

      modal.classList.remove('hidden');
    }

    function closeModal(e) {
      if (e.target === document.getElementById('modal')) {
        document.getElementById('modal').classList.add('hidden');
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function refresh() {
      await Promise.all([fetchStats(), fetchLogs()]);
    }

    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
